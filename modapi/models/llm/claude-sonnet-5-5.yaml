model: claude-sonnet-5-5
label:
  en_US: claude-sonnet-5-5
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 128000
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_object
  - json_schema
  help:
    en_US: Plain text, any JSON object, or JSON that follows a schema.
- name: json_schema
  use_template: json_schema
pricing:
  input: '2'
  output: '10'
  unit: '0.000001'
  currency: USD
