model: gemini-3.8-flash
label:
  en_US: gemini-3.8-flash
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- vision
- structured-output
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 65536
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_object
  - json_schema
  help:
    en_US: Plain text, any JSON object, or JSON that follows a schema.
- name: json_schema
  use_template: json_schema
pricing:
  input: '0.75'
  output: '3.75'
  unit: '0.000001'
  currency: USD
