model: glm-4.5
label:
  en_US: glm-4.5
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  required: false
  min: 1
  default: 4096
  max: 96000
pricing:
  input: '0.6'
  output: '2.2'
  unit: '0.000001'
  currency: USD
