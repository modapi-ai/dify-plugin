model: glm-5.3-flash
label:
  en_US: glm-5.3-flash
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  required: false
  min: 1
  default: 4096
  max: 128000
pricing:
  input: '0.15'
  output: '0.5'
  unit: '0.000001'
  currency: USD
