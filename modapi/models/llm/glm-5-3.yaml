model: glm-5.3
label:
  en_US: glm-5.3
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  required: false
  min: 1
  default: 4096
  max: 131072
pricing:
  input: '1.4'
  output: '4.4'
  unit: '0.000001'
  currency: USD
