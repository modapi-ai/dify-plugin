model: gpt-4
label:
  en_US: gpt-4
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
model_properties:
  mode: chat
  context_size: 8192
parameter_rules:
- name: temperature
  use_template: temperature
- name: top_p
  use_template: top_p
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 4096
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_object
  help:
    en_US: Plain text, any JSON object, or JSON that follows a schema.
pricing:
  input: '30'
  output: '60'
  unit: '0.000001'
  currency: USD
