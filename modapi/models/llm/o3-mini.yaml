model: o3-mini
label:
  en_US: o3-mini
model_type: llm
features:
- tool-call
- multi-tool-call
- stream-tool-call
- agent-thought
- structured-output
model_properties:
  mode: chat
  context_size: 200000
parameter_rules:
- name: max_tokens
  use_template: max_tokens
  default: 4096
  min: 1
  max: 100000
- name: reasoning_effort
  label:
    en_US: Reasoning effort
  type: string
  required: false
  options:
  - low
  - medium
  - high
  help:
    en_US: How much the model reasons before it answers. Lower is faster and cheaper.
- name: response_format
  label:
    en_US: Response format
  type: string
  required: false
  options:
  - text
  - json_object
  - json_schema
  help:
    en_US: Plain text, any JSON object, or JSON that follows a schema.
- name: json_schema
  use_template: json_schema
pricing:
  input: '1.1'
  output: '4.4'
  unit: '0.000001'
  currency: USD
